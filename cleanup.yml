---
- name: Cleanup Satellite Configuration Drift
  hosts: localhost
  become: false
  gather_facts: false
  vars_files:
    - vars/lab_connection.yml
    - vars/locations.yml
    - vars/mappings/locations.yml
  vars:
    cleanup_apply_changes: false   # -e cleanup_apply_changes=true to delete changes
    protected_locations:
      - "Default Location"         
  tasks:
    - name: Cleanup Locations
      ansible.builtin.include_tasks: playbooks/tasks/cleanup/cleanup_locations.yml
      tags: 'locations'
